<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.U.T.R.I. — Chatbot Rule-Based</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI Emoji', 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eaeaea;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: #0f3460;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .header-title h1 {
    font-size: 1.2rem;
    color: #e94560;
    font-weight: bold;
  }
  .header-title p {
    font-size: 0.75rem;
    color: #8888aa;
  }
  .header-btns button {
    background: #16213e;
    color: #eaeaea;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    margin-left: 6px;
    transition: background 0.2s;
  }
  .header-btns button:hover { background: #2a2a4e; }

  /* CHAT AREA */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }

  .msg-wrapper {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrapper.bot  { align-self: flex-start; align-items: flex-start; }

  .msg-meta {
    font-size: 0.7rem;
    color: #8888aa;
    margin-bottom: 3px;
    padding: 0 4px;
  }
  .msg-wrapper.user .msg-meta { color: #f5a623; font-weight: bold; }
  .msg-wrapper.bot  .msg-meta { color: #7ec8e3; font-weight: bold; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg-wrapper.user .msg-bubble {
    background: #0f3460;
    color: #eaeaea;
    border-bottom-right-radius: 4px;
  }
  .msg-wrapper.bot .msg-bubble {
    background: #16213e;
    color: #d9e8f5;
    border-bottom-left-radius: 4px;
  }

  .typing-indicator {
    align-self: flex-start;
    color: #e94560;
    font-style: italic;
    font-size: 0.85rem;
    padding: 6px 4px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .system-msg {
    align-self: center;
    text-align: center;
    color: #8888aa;
    font-size: 0.82rem;
    font-style: italic;
    padding: 8px 16px;
    white-space: pre-line;
    line-height: 1.6;
  }

  /* INPUT AREA */
  #input-area {
    background: #16213e;
    padding: 10px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #user-input {
    flex: 1;
    background: #1e2a45;
    color: #eaeaea;
    border: 1px solid #2a2a4e;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.92rem;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color 0.2s;
  }
  #user-input:focus { border-color: #e94560; }
  #user-input::placeholder { color: #8888aa; }

  #btn-kirim {
    background: #e94560;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #btn-kirim:hover   { background: #c73652; }
  #btn-kirim:disabled{ background: #555; cursor: not-allowed; }

  /* STATUS */
  #status-bar {
    background: #1a1a2e;
    color: #8888aa;
    font-size: 0.72rem;
    padding: 4px 16px;
    flex-shrink: 0;
  }

  /* SCROLLBAR */
  #chat-area::-webkit-scrollbar { width: 5px; }
  #chat-area::-webkit-scrollbar-track { background: #1a1a2e; }
  #chat-area::-webkit-scrollbar-thumb { background: #2a2a4e; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>🌸 P.U.T.R.I.</h1>

  </div>
  <div class="header-btns">
    <button onclick="bersihkanChat()">🗑 Bersihkan</button>

  </div>
</header>

<div id="chat-area"></div>

<div id="input-area">

</div>

<div id="status-bar">Siap ngobrol! 😊</div>

  [/\b(kiamat|dunia berakhir)\b/i, ['Santai aja, kalau dunia kiamat serverku juga mati kok, kita senasib 🥲💥']],
  [/\b(makasih|suwun|nuhun|terima kasih)\b/i, ['Sama-sama! Kapan aja butuh temen ngobrol, cari PUTRI aja ya ✨','Yoi! Santai aja bos 😎','Matur nuwun wangsul! 🙇‍♀️']],
  [/\b(dadah|pamit|bye|keluar|sampai jumpa)\b/i, ['Dadah! Ati-ati ya! 👋✨','Yah kok pamit sih... Yaudah deh, bye bye! 🥺','Suwun wes mampir! Aja lali bali mrene maneh yo! 🏃‍♀️💨']],
];

const slangMap = {
  'yg': 'yang', 'spt': 'seperti', 'krn': 'karena', 'dgn': 'dengan',
  'klo': 'kalau', 'kl': 'kalau', 'bnyk': 'banyak', 'jg': 'juga',
  'gk': 'nggak', 'gak': 'nggak', 'nda': 'tidak', 'btw': 'ngomong-ngomong',
  'ntr': 'nanti', 'skrg': 'sekarang', 'lgsg': 'langsung',
  'smg': 'semoga', 'sll': 'selalu', 'tdr': 'tidur',
};

const fallback = [
  'Hah? Piye toh maksudmu? PUTRI ndak paham 😭',
  'Coba ngomongnya yang jelas dong, bingung nih PUTRI 😐',
  'Ooh gitu... terus terus? Kepo nih 🥹',
  'Walah, mboh ah. PUTRI lagi loading ini 🫠',
  'Hmm, itu di luar kapasitas PUTRI. Coba tanya yang lain dong! 🥺',
  'Maap ya, PUTRI masih versi 1.0. Belajar terus nih! 🙏',
];

// ============================================================
// ENGINE
// ============================================================
let namaUser = null;
let pesanCount = 0;
let logChat = [];

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

function preprocess(teks) {
  teks = teks.toLowerCase().trim();
  Object.entries(slangMap).forEach(([k, v]) => {
    teks = teks.replace(new RegExp(`\\b${k}\\b`, 'g'), v);
  });
  return teks;
}

function pilihAcak(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function ngobrolSamaPutri(input) {
  pesanCount++;
  const teks = preprocess(input);

  // Cek nama user
  const namaMatch = teks.match(/\b(?:namaku|nama aku|nama saya|panggil aku|jenengku|asmane)\s+([a-zA-Z]+)/i);
  if (namaMatch) namaUser = cap(namaMatch[1]);

  for (const [pola, respons] of aturan) {
    const cocok = teks.match(pola);
    if (cocok) {
      const daftar = typeof respons === 'function' ? respons(cocok) : respons;
      return pilihAcak(daftar);
    }
  }

  const base = pilihAcak(fallback);
  return namaUser ? `${namaUser}, ${base}` : base;
}

// ============================================================
// UI
// ============================================================
const chatArea   = document.getElementById('chat-area');
const inputEl    = document.getElementById('user-input');
const btnKirim   = document.getElementById('btn-kirim');
const statusBar  = document.getElementById('status-bar');

function waktuSekarang() {
  return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function tambahPesan(sender, teks, isUser) {
  const wrapper = document.createElement('div');
  wrapper.className = `msg-wrapper ${isUser ? 'user' : 'bot'}`;

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = `${sender}  ${waktuSekarang()}`;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = teks;

  wrapper.appendChild(meta);
  wrapper.appendChild(bubble);
  chatArea.appendChild(wrapper);
  chatArea.scrollTop = chatArea.scrollHeight;
  return wrapper;
}

function tampilkanPembuka() {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent =
    "🌸══════════════════════════════🌸\n" +
    "  P.U.T.R.I. v1.1 — Asisten Bilingual\n" +
    "  Pemroses Ucapan Teks Responsif Indonesia\n" +
    "🌸══════════════════════════════🌸";
  chatArea.appendChild(div);
  tambahPesan('PUTRI', 'Halo! Aku PUTRI, asisten virtualmu yang siap ngobrol kapan aja. Ketik apa aja, atau "bye" buat keluar~ 😊', false);
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing-indicator';
  el.id = 'typing-indicator';
  el.textContent = 'PUTRI sedang mengetik... ✍️';
  chatArea.appendChild(el);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function kirimPesan() {
  const pesan = inputEl.value.trim();
  if (!pesan) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  const waktu = waktuSekarang();
  tambahPesan('Kamu', pesan, true);
  logChat.push(`[${waktu}] Kamu: ${pesan}`);

  btnKirim.disabled = true;
  btnKirim.textContent = '...';
  statusBar.textContent = 'PUTRI sedang mengetik...';
  showTyping();

  setTimeout(() => {
    hideTyping();
    const balasan = ngobrolSamaPutri(pesan);
    tambahPesan('PUTRI', balasan, false);
    logChat.push(`[${waktu}] PUTRI: ${balasan}`);
    btnKirim.disabled = false;
    btnKirim.textContent = 'Kirim ➤';
    statusBar.textContent = `Pesan terkirim — ${pesanCount} pesan hari ini`;
  }, 400 + Math.random() * 400);
}

function bersihkanChat() {
  if (confirm('Hapus semua riwayat chat?')) {
    chatArea.innerHTML = '';
    logChat = [];
    pesanCount = 0;
    namaUser = null;
    tampilkanPembuka();
    statusBar.textContent = 'Siap ngobrol! 😊';
  }
}

function simpanLog() {
  if (!logChat.length) { alert('Belum ada riwayat chat untuk disimpan.'); return; }
  const now = new Date();
  const ts = now.toISOString().replace(/[:.]/g, '-').slice(0, 16);
  const isi = [
    '='.repeat(50),
    '  PUTRI Chat Log',
    `  Tanggal: ${now.toLocaleDateString('id-ID', {day:'2-digit', month:'long', year:'numeric'})}`,
    '='.repeat(50), '',
    ...logChat
  ].join('\n');
  const blob = new Blob([isi], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `putri_log_${ts}.txt`;
  a.click();
}

// Enter to send, Shift+Enter for newline
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    kirimPesan();
  }
});

// Auto resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Init
tampilkanPembuka();
</script>
</body>
</html>
